<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-hotel" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050818"/>
      <stop offset="50%" stop-color="#0a102c"/>
      <stop offset="100%" stop-color="#02040d"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="blur-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-hotel)"/>
  <circle cx="290" cy="190" r="190" fill="#3b82f6" fill-opacity="0.2" filter="url(#blur-glow-blue)"/>
  <circle cx="930" cy="510" r="210" fill="#2563eb" fill-opacity="0.18" filter="url(#blur-glow-blue)"/>

  <!-- Top Navigation -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#0d1536" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="75" cy="60" r="14" fill="#3b82f6"/>
  <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RH</text>
  <text x="105" y="65" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">RoyalHotel Luxury &amp; Resort System</text>
  <rect x="990" y="44" width="150" height="32" rx="8" fill="url(#blue-glow)"/>
  <text x="1065" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Concierge Desk</text>

  <!-- Left Sidebar -->
  <rect x="40" y="110" width="220" height="600" rx="16" fill="#0d1536" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="65" y="145" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HOSPITALITY OPS</text>
  <rect x="55" y="165" width="190" height="34" rx="8" fill="#172554" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="75" y="187" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12">🛎 Room Matrix</text>
  <text x="75" y="222" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">🏨 Guest Check-Ins</text>
  <text x="75" y="257" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">🍽 Restaurant &amp; Room Service</text>
  <text x="75" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">💳 Invoicing &amp; Folios</text>
  <text x="75" y="327" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">🧹 Housekeeping Schedule</text>

  <!-- Main Content Area -->
  <rect x="280" y="110" width="880" height="600" rx="20" fill="#0b122e" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Metrics Grid -->
  <g transform="translate(310, 140)">
    <rect x="0" y="0" width="260" height="120" rx="14" fill="#131e47" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Tonight's Occupancy Rate</text>
    <text x="20" y="75" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="32" font-weight="800">92.4%</text>
    <text x="20" y="100" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">▲ High Season Peak Capacity</text>

    <rect x="280" y="0" width="260" height="120" rx="14" fill="#131e47" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="300" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Pending Arrivals Today</text>
    <text x="300" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800">48 Suites</text>
    <text x="300" y="100" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Express VIP Check-in Ready</text>

    <rect x="560" y="0" width="260" height="120" rx="14" fill="#131e47" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="580" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">RevPAR (Revenue / Room)</text>
    <text x="580" y="75" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="32" font-weight="800">$284.50</text>
    <text x="580" y="100" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">+15.8% Year-over-Year</text>
  </g>

  <!-- Reservation & Room Availability Matrix -->
  <rect x="310" y="290" width="820" height="390" rx="16" fill="#131e47" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="335" y="325" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Live Executive Suite Allocations</text>

  <!-- Room 1 -->
  <rect x="335" y="345" width="770" height="65" rx="10" fill="#19285c"/>
  <text x="355" y="375" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Penthouse Oceanview Suite (#501)</text>
  <text x="355" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Guest: Lord Sterling • 5 Nights • Butler Service Requested</text>
  <rect x="1000" y="362" width="85" height="28" rx="6" fill="#2563eb"/>
  <text x="1042" y="380" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Occupied</text>

  <!-- Room 2 -->
  <rect x="335" y="425" width="770" height="65" rx="10" fill="#19285c"/>
  <text x="355" y="455" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Presidential Royal King (#408)</text>
  <text x="355" y="475" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Guest: Dr. Samantha Vance • Checked in at 14:15 PM</text>
  <rect x="1000" y="442" width="85" height="28" rx="6" fill="#2563eb"/>
  <text x="1042" y="460" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Occupied</text>

  <!-- Room 3 -->
  <rect x="335" y="505" width="770" height="65" rx="10" fill="#19285c"/>
  <text x="355" y="535" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Executive Deluxe Twin (#302)</text>
  <text x="355" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Turnaround Completed • Inspected by Housekeeping Lead</text>
  <rect x="1000" y="522" width="85" height="28" rx="6" fill="#059669"/>
  <text x="1042" y="540" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Available</text>

  <!-- Tech Strip -->
  <rect x="335" y="590" width="770" height="65" rx="10" fill="#0e1738" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="355" y="627" fill="#60a5fa" font-family="system-ui, monospace" font-size="12">FULL STACK HOTEL ENGINE • PHP • MYSQL TRANSACTION ISOLATION • REALTIME AUDIT LOGS</text>
</svg>
