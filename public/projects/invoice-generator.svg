<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-inv" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051410"/>
      <stop offset="50%" stop-color="#0a201a"/>
      <stop offset="100%" stop-color="#020806"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="blur-glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-inv)"/>
  <circle cx="280" cy="200" r="180" fill="#10b981" fill-opacity="0.18" filter="url(#blur-glow-emerald)"/>
  <circle cx="950" cy="500" r="220" fill="#059669" fill-opacity="0.15" filter="url(#blur-glow-emerald)"/>

  <!-- Top Navigation -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#0d241d" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="75" cy="60" r="14" fill="#10b981"/>
  <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">IG</text>
  <text x="105" y="65" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">QuickInvoice Pro</text>
  
  <rect x="990" y="44" width="150" height="32" rx="8" fill="url(#emerald-glow)"/>
  <text x="1065" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Export PDF (html2pdf)</text>

  <!-- Left Form / Configuration Area -->
  <rect x="40" y="110" width="340" height="600" rx="16" fill="#0d241d" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="65" y="145" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INVOICE SETTINGS</text>
  
  <text x="65" y="185" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">CLIENT DETAILS</text>
  <rect x="65" y="195" width="290" height="36" rx="8" fill="#14362c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="218" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Acme Global Technologies Inc.</text>

  <text x="65" y="255" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">INVOICE NUMBER</text>
  <rect x="65" y="265" width="290" height="36" rx="8" fill="#14362c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="288" fill="#a7f3d0" font-family="system-ui, monospace" font-size="12">#INV-2026-0894</text>

  <text x="65" y="325" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">CURRENCY &amp; TAX RATE</text>
  <rect x="65" y="335" width="290" height="36" rx="8" fill="#14362c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="358" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">USD ($) • 18% Standard GST</text>

  <rect x="65" y="630" width="290" height="42" rx="10" fill="#10b981"/>
  <text x="210" y="656" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+ Add New Line Item</text>

  <!-- Right Invoice Paper Sheet Preview -->
  <rect x="410" y="110" width="750" height="600" rx="16" fill="#ffffff" stroke="#ffffff" stroke-opacity="0.2"/>
  
  <!-- Sheet Header -->
  <text x="450" y="165" fill="#111827" font-family="system-ui, sans-serif" font-size="24" font-weight="800">INVOICE</text>
  <text x="450" y="185" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">Issued Date: Oct 24, 2026 • Due: Net 30</text>

  <rect x="1000" y="145" width="120" height="28" rx="6" fill="#ecfdf5"/>
  <text x="1060" y="164" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS: PAID</text>

  <!-- Items Table Header -->
  <rect x="450" y="220" width="670" height="36" rx="6" fill="#f3f4f6"/>
  <text x="470" y="243" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DESCRIPTION</text>
  <text x="820" y="243" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="700">HOURS</text>
  <text x="940" y="243" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RATE</text>
  <text x="1060" y="243" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TOTAL</text>

  <!-- Table Row 1 -->
  <text x="470" y="285" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Android Native Architecture &amp; Compose UI</text>
  <text x="830" y="285" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">40</text>
  <text x="940" y="285" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">$90.00</text>
  <text x="1060" y="285" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$3,600.00</text>
  <line x1="450" y1="305" x2="1120" y2="305" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Table Row 2 -->
  <text x="470" y="340" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Full Stack API Middleware &amp; Cloud Deployment</text>
  <text x="830" y="340" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">25</text>
  <text x="940" y="340" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">$95.00</text>
  <text x="1060" y="340" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$2,375.00</text>
  <line x1="450" y1="360" x2="1120" y2="360" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Table Row 3 -->
  <text x="470" y="395" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Client-Side PDF Generator Engine Integration</text>
  <text x="830" y="395" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">15</text>
  <text x="940" y="395" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">$85.00</text>
  <text x="1060" y="395" fill="#111827" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$1,275.00</text>
  <line x1="450" y1="415" x2="1120" y2="415" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Totals Block -->
  <rect x="850" y="445" width="270" height="135" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="870" y="475" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">Subtotal:</text>
  <text x="1090" y="475" fill="#111827" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$7,250.00</text>

  <text x="870" y="505" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">Tax (18%):</text>
  <text x="1090" y="505" fill="#111827" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$1,305.00</text>

  <line x1="870" y1="520" x2="1090" y2="520" stroke="#d1d5db" stroke-width="1"/>
  <text x="870" y="555" fill="#111827" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Total Amount:</text>
  <text x="1090" y="555" fill="#059669" font-family="system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="end">$8,555.00</text>
</svg>
