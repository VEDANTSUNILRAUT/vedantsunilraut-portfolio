  <text x="355" y="405" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Coach Alex Rivers • Studio A • 07:00 AM - 08:30 AM</text>
  <rect x="990" y="372" width="95" height="30" rx="6" fill="#f43f5e"/>
  <text x="1037" y="392" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Booked (24/24)</text>

  <!-- Class 2 -->
  <rect x="335" y="435" width="770" height="65" rx="10" fill="#3d1425"/>
  <text x="355" y="465" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Vinyasa Yoga &amp; Mobility</text>
  <text x="355" y="485" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Coach Elena Rostova • Studio C • 10:00 AM - 11:15 AM</text>
  <rect x="990" y="452" width="95" height="30" rx="6" fill="#059669"/>
  <text x="1037" y="472" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">4 Spots Left</text>

  <!-- Class 3 -->
  <rect x="335" y="515" width="770" height="65" rx="10" fill="#3d1425"/>
  <text x="355" y="545" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Olympic Weightlifting Mastery</text>
  <text x="355" y="565" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Coach Marcus King • Main Arena • 05:30 PM - 07:00 PM</text>
  <rect x="990" y="532" width="95" height="30" rx="6" fill="#f43f5e"/>
  <text x="1037" y="552" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Booked (18/18)</text>

  <!-- Tech Strip -->
  <rect x="335" y="600" width="770" height="60" rx="10" fill="#200a13" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="355" y="635" fill="#f43f5e" font-family="system-ui, monospace" font-size="12">PHP 8 • MYSQL DATABASE • SESSION AUTH • ROLE-BASED ACCESS CONTROL</text>
