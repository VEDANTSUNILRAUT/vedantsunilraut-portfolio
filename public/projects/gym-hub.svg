  <rect x="55" y="165" width="190" height="34" rx="8" fill="#3d1423" stroke="#f43f5e" stroke-opacity="0.4"/>
  <text x="75" y="187" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12">🏋 Active Memberships</text>
  <text x="75" y="222" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">📅 Class Schedules</text>
  <text x="75" y="257" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">🥊 Trainer Assignments</text>
  <text x="75" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">💳 Billing &amp; Invoices</text>
