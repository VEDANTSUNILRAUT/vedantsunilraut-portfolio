  <!-- Main Content Area -->
  <rect x="280" y="110" width="880" height="600" rx="20" fill="#1b080f" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Metrics Grid -->
  <g transform="translate(310, 140)">
