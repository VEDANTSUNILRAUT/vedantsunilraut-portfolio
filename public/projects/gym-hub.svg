  <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GH</text>
  <text x="105" y="65" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Gym Hub Management</text>
  <rect x="990" y="44" width="150" height="32" rx="8" fill="url(#rose-glow)"/>
