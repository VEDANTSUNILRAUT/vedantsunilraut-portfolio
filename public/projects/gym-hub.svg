    <text x="20" y="80" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="34" font-weight="800">842</text>
    <text x="20" y="108" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">▲ +12% Net Growth this Q3</text>

