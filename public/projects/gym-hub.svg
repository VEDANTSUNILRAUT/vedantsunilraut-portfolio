<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gym" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18040a"/>
      <stop offset="50%" stop-color="#260812"/>
      <stop offset="100%" stop-color="#0a0205"/>
    </linearGradient>
    <linearGradient id="rose-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="blur-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-gym)"/>
  <circle cx="300" cy="190" r="180" fill="#f43f5e" fill-opacity="0.2" filter="url(#blur-glow-rose)"/>
  <circle cx="940" cy="510" r="220" fill="#e11d48" fill-opacity="0.18" filter="url(#blur-glow-rose)"/>

  <!-- Top Nav -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#240c15" stroke="#ffffff" stroke-opacity="0.12"/>
