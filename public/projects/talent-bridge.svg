<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-talent" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="blur-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-talent)"/>
  <circle cx="350" cy="180" r="190" fill="#06b6d4" fill-opacity="0.2" filter="url(#blur-glow-cyan)"/>
  <circle cx="900" cy="520" r="210" fill="#3b82f6" fill-opacity="0.18" filter="url(#blur-glow-cyan)"/>

  <!-- Top Nav -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="75" cy="60" r="14" fill="#06b6d4"/>
  <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TB</text>
  <text x="105" y="65" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Talent-Bridge AI</text>
  
  <rect x="420" y="44" width="340" height="32" rx="8" fill="#13233a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="450" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Find candidate matches, role skills...</text>
  <rect x="1010" y="44" width="130" height="32" rx="8" fill="url(#cyan-glow)"/>
  <text x="1075" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Recruiter Portal</text>

  <!-- Left Sidebar -->
  <rect x="40" y="110" width="220" height="600" rx="16" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="65" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">DASHBOARD</text>
  <rect x="55" y="165" width="190" height="34" rx="8" fill="#142c47" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="75" y="187" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12">🎙 AI Mock Interview</text>
  <text x="75" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">📄 Smart Resume Builder</text>
  <text x="75" y="257" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🧠 Aptitude Quizzes</text>
  <text x="75" y="292" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">💼 Job Postings</text>
  <text x="75" y="327" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">📊 Matching Analytics</text>

  <!-- Main Content Area -->
  <rect x="280" y="110" width="880" height="600" rx="20" fill="#0b1626" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- AI Voice & Mock Interview Card -->
  <rect x="310" y="140" width="520" height="230" rx="16" fill="#102035" stroke="#06b6d4" stroke-opacity="0.25"/>
  <rect x="335" y="165" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15"/>
  <text x="400" y="181" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LIVE AI EVALUATOR</text>

  <text x="335" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Software Engineer Simulation</text>
  <text x="335" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Behavioral &amp; Technical Questions • Real-Time Speech Analysis</text>

  <!-- Waveform lines -->
  <g transform="translate(335, 275)">
    <rect x="0" y="15" width="6" height="20" rx="3" fill="#06b6d4"/>
    <rect x="12" y="5" width="6" height="40" rx="3" fill="#22d3ee"/>
    <rect x="24" y="0" width="6" height="50" rx="3" fill="#38bdf8"/>
    <rect x="36" y="10" width="6" height="30" rx="3" fill="#06b6d4"/>
    <rect x="48" y="18" width="6" height="15" rx="3" fill="#0284c7"/>
    <rect x="60" y="8" width="6" height="35" rx="3" fill="#38bdf8"/>
    <rect x="72" y="2" width="6" height="45" rx="3" fill="#22d3ee"/>
    <rect x="84" y="12" width="6" height="25" rx="3" fill="#06b6d4"/>
  </g>
  <rect x="450" y="280" width="140" height="36" rx="8" fill="#06b6d4"/>
  <text x="520" y="303" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Start Response</text>

  <!-- Match Score Radial Widget -->
  <rect x="850" y="140" width="280" height="230" rx="16" fill="#102035" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="875" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Overall Match Quality</text>
  <circle cx="990" cy="245" r="55" stroke="#1e3a5f" stroke-width="12" fill="none"/>
  <circle cx="990" cy="245" r="55" stroke="#06b6d4" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="40" fill="none" stroke-linecap="round"/>
  <text x="990" y="255" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle">94%</text>
  <text x="990" y="335" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">High Hire Probability</text>

  <!-- Job Recommendations Table -->
  <rect x="310" y="390" width="820" height="290" rx="16" fill="#102035" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="335" y="425" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Top Matched Engineering Roles</text>

  <!-- Row 1 -->
  <rect x="335" y="445" width="770" height="60" rx="10" fill="#14263f" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="355" y="480" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Senior Android Engineer</text>
  <text x="355" y="495" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Remote • Kotlin, Compose, MVVM</text>
  <rect x="940" y="460" width="80" height="28" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="980" y="478" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">98% Match</text>
  <rect x="1030" y="460" width="65" height="28" rx="6" fill="#06b6d4"/>
  <text x="1062" y="478" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Apply</text>

  <!-- Row 2 -->
  <rect x="335" y="515" width="770" height="60" rx="10" fill="#14263f" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="355" y="550" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Full Stack Next.js Specialist</text>
  <text x="355" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hybrid • React, Node.js, TypeScript</text>
  <rect x="940" y="530" width="80" height="28" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="980" y="548" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">95% Match</text>
  <rect x="1030" y="530" width="65" height="28" rx="6" fill="#06b6d4"/>
  <text x="1062" y="548" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Apply</text>

  <!-- Row 3 -->
  <rect x="335" y="585" width="770" height="60" rx="10" fill="#14263f" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="355" y="620" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AI Platform Developer</text>
  <text x="355" y="635" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">On-Site • Python, OpenAI APIs, MySQL</text>
  <rect x="940" y="600" width="80" height="28" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="980" y="618" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">92% Match</text>
  <rect x="1030" y="600" width="65" height="28" rx="6" fill="#06b6d4"/>
  <text x="1062" y="618" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Apply</text>
</svg>
