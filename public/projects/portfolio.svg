<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-port" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bg-port)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="200" r="180" fill="#a855f7" fill-opacity="0.25" filter="url(#blur-glow)"/>
  <circle cx="950" cy="500" r="220" fill="#6366f1" fill-opacity="0.2" filter="url(#blur-glow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#131122" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="75" cy="60" r="14" fill="#a855f7"/>
  <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VR</text>
  <text x="105" y="65" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">VedantRaut.dev</text>
  
  <rect x="460" y="44" width="280" height="32" rx="8" fill="#1c1930" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="500" y="65" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Search architecture, docs...</text>
  <circle cx="480" cy="60" r="5" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  
  <rect x="1010" y="44" width="130" height="32" rx="8" fill="url(#purple-glow)"/>
  <text x="1075" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Get In Touch</text>

  <!-- Left Sidebar / Navigation Tree -->
  <rect x="40" y="110" width="220" height="600" rx="16" fill="#131122" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="65" y="145" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">EXPLORER</text>
  
  <rect x="55" y="165" width="190" height="34" rx="8" fill="#201b38" stroke="#a855f7" stroke-opacity="0.3"/>
  <text x="75" y="187" fill="#e9d5ff" font-family="system-ui, monospace" font-size="12">⚡ HeroSection.tsx</text>
  <text x="75" y="222" fill="#9ca3af" font-family="system-ui, monospace" font-size="12">📁 FeaturedWork/</text>
  <text x="75" y="257" fill="#9ca3af" font-family="system-ui, monospace" font-size="12">📁 Experience/</text>
  <text x="75" y="292" fill="#9ca3af" font-family="system-ui, monospace" font-size="12">📁 Skills/</text>
  <text x="75" y="327" fill="#9ca3af" font-family="system-ui, monospace" font-size="12">📄 globals.css</text>

  <rect x="55" y="580" width="190" height="110" rx="12" fill="#1a152e" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="70" y="610" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SYSTEM STATUS</text>
  <circle cx="75" cy="635" r="4" fill="#34d399"/>
  <text x="88" y="639" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">60 FPS Motion Engine</text>
  <circle cx="75" cy="665" r="4" fill="#60a5fa"/>
  <text x="88" y="669" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Next.js 16 • Turbo</text>

