  <rect x="280" y="110" width="880" height="600" rx="20" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Hero Banner inside Mockup -->
  <rect x="310" y="140" width="820" height="240" rx="16" fill="#151226" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="335" y="170" width="160" height="26" rx="13" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="415" y="187" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">★ PORTFOLIO 2.0</text>

  <text x="335" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Vedant Sunil Raut</text>
  <text x="335" y="270" fill="#c084fc" font-family="system-ui, sans-serif" font-size="17" font-weight="600">Software Engineer &amp; Android Specialist</text>
  <text x="335" y="300" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13">High-performance reactive interfaces with Kotlin, Compose &amp; Next.js</text>

  <rect x="335" y="325" width="130" height="36" rx="10" fill="#a855f7"/>
  <text x="400" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">View Projects ➔</text>
  <rect x="480" y="325" width="120" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="540" y="348" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Experience</text>

  <!-- Metric / Tech Cards Row -->
  <g transform="translate(310, 405)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#17142b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Lighthouse Score</text>
    <text x="20" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="36" font-weight="800">100%</text>
    <text x="20" y="115" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">⚡ Ultra-fast TTFB &amp; Core Vitals</text>

    <!-- Card 2 -->
    <rect x="280" y="0" width="260" height="150" rx="14" fill="#17142b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="300" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Stack Depth</text>
    <text x="300" y="80" fill="#c084fc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Full Stack</text>
    <text x="300" y="115" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12">Android KMP • React • Next.js</text>

    <!-- Card 3 -->
    <rect x="560" y="0" width="260" height="150" rx="14" fill="#17142b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="580" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">3D Interactivity</text>
    <text x="580" y="80" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Dynamic</text>
    <text x="580" y="115" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">Framer Motion • WebGL</text>
  </g>

  <!-- Bottom Code Pill -->
  <rect x="310" y="580" width="820" height="100" rx="14" fill="#100d20" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="335" cy="605" r="5" fill="#ef4444"/>
  <circle cx="350" cy="605" r="5" fill="#eab308"/>
  <circle cx="365" cy="605" r="5" fill="#22c55e"/>
  <text x="390" y="610" fill="#a855f7" font-family="system-ui, monospace" font-size="12">const</text>
  <text x="430" y="610" fill="#ffffff" font-family="system-ui, monospace" font-size="12">engineer = { name:</text>
  <text x="560" y="610" fill="#34d399" font-family="system-ui, monospace" font-size="12">"Vedant Raut"</text>
  <text x="660" y="610" fill="#ffffff" font-family="system-ui, monospace" font-size="12">, focus:</text>
  <text x="725" y="610" fill="#34d399" font-family="system-ui, monospace" font-size="12">"Mobile &amp; Distributed Systems"</text>
  <text x="965" y="610" fill="#ffffff" font-family="system-ui, monospace" font-size="12">};</text>
  <text x="335" y="645" fill="#6b7280" font-family="system-ui, monospace" font-size="12">// Interactive 3D Showcase powered by React Bits &amp; 21st.dev</text>
</svg>
